<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>奇迹暖暖·世界巡游进度</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { font-family: -apple-system, sans-serif; background: #f7f8fa; color: #1f1f1f; font-size: 14px; line-height: 1.4; width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 12px 8px 0; }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header .sub { font-size: 11px; color: #8e8e93; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; white-space: nowrap; }
  .tab { border: none; border-radius: 16px; padding: 6px 12px; font-size: 12px; font-weight: 500; background: #fff; color: #4b4b4b; }
  .tab.active { background: #ff2442; color: #fff; font-weight: 600; }
  .table-card { flex: 1; background: #fff; border-radius: 14px; overflow: auto; padding-bottom: 80px; }
  .flex-table { display: inline-flex; flex-direction: column; min-width: 100%; }
  .thead { display: flex; background: #fafafc; font-weight: 600; color: #6e6e73; font-size: 12px; border-bottom: 1px solid #efeff4; text-align: center; }
  .th { border-right: 1px solid #efeff4; padding: 8px 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .th:last-child { border-right: none; }
  .w-city { width: 13%; } .w-spot { width: 22%; } .w-event { width: 28%; } .w-sticker { width: 15%; } .w-day, .w-dusk, .w-night { width: 6%; } .w-weather { width: 10%; }
  .tbody { display: flex; flex-direction: column; }
  .tr-row { display: flex; border-bottom: 1px solid #efeff4; align-items: stretch; }
  .td { border-right: 1px solid #efeff4; padding: 10px 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; min-height: 44px; flex-shrink: 0; text-align: center; }
  .td:last-child { border-right: none; }
  .col-group { display: flex; flex-direction: column; border-right: 1px solid #efeff4; flex-shrink: 0; }
  .col-group .td { border-right: none; flex: 1; min-height: 44px; }
  .empty-cell { color: transparent; }
  .markable { cursor: pointer; }
  .done { background: #e8f8ec !important; color: #2e7d32 !important; }
  .done.event-cell { text-decoration: line-through; text-decoration-color: #81c784; }
  .selected { background: #fff3e0 !important; box-shadow: inset 0 0 0 2px #ff9800; }
  .done.selected { background: #dff3e4 !important; box-shadow: inset 0 0 0 2px #43a047; }
  .action-bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); padding: 10px 14px; display: flex; align-items: center; gap: 6px; z-index: 20; border-top: 1px solid #efeff4; }
  .progress-text { font-size: 12px; color: #6e6e73; flex: 1; }
  .progress-text b { color: #ff2442; font-size: 15px; font-weight: 700; }
  .action-bar button { border: none; border-radius: 20px; padding: 9px 10px; font-size: 13px; font-weight: 600; }
  #btnDone { background: #2e9d52; color: #fff; } #btnDone:disabled { background: #c8e6c9; }
  #btnUndone { background: #fff; color: #6e6e73; box-shadow: inset 0 0 0 1px #e5e5ea; } #btnUndone:disabled { color: #c7c7cc; }
  #btnReset { background: #fff; color: #999; box-shadow: inset 0 0 0 1px #e5e5ea; }
  #btnSave { background: #fff; color: #1677ff; box-shadow: inset 0 0 0 1px #1677ff; }
  #btnCode { background: #fff; color: #ff9800; box-shadow: inset 0 0 0 1px #ff9800; }
  #imgOverlay, #codeOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; }
  #imgOverlay.show, #codeOverlay.show { display: flex; }
  #imgPreview { max-width: 100%; max-height: 80vh; }
  .code-box { background: #fff; border-radius: 14px; width: 90%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .code-box textarea { width: 100%; height: 100px; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 12px; }
  .code-actions { display: flex; gap: 10px; }
  .code-actions button { flex: 1; padding: 10px 0; border: none; border-radius: 8px; font-weight: 600; }
  #btnCopyCode { background: #1677ff; color: #fff; } #btnPasteCode { background: #2e9d52; color: #fff; }
</style>
</head>
<body>
  <div class="header"><h1>🧳 世界巡游</h1><span class="sub">点格子标记完成</span></div>
  <div class="tabs">
    <span class="tab active">苹果</span><span class="tab">云端</span><span class="tab">莉莉斯</span><span class="tab">信鸽</span><span class="tab">北地</span><span class="tab">荒原</span>
  </div>
  <div class="table-card" id="tableCard">
    <div class="flex-table">
      <div class="thead">
        <div class="th w-city">城市</div><div class="th w-spot">景点</div><div class="th w-event">事件</div><div class="th w-sticker">贴纸</div>
        <div class="th w-day">昼</div><div class="th w-dusk">暮</div><div class="th w-night">夜</div><div class="th w-weather">天气</div>
      </div>
      <div class="tbody" id="tourBody"></div>
    </div>
  </div>
  <div class="action-bar">
    <div class="progress-text" id="progressText">当前国家：<b>0</b> / 0 项</div>
    <button id="btnCode">🔑 存档</button>
    <button id="btnSave">📷 存图</button>
    <button id="btnDone" disabled>✅ 完成</button>
    <button id="btnUndone" disabled>↩️ 取消</button>
    <button id="btnReset">重置</button>
  </div>
  <div id="imgOverlay" onclick="this.classList.remove('show')">
    <img id="imgPreview" src="">
  </div>
  <div id="codeOverlay" onclick="this.classList.remove('show')">
    <div class="code-box" onclick="event.stopPropagation()">
      <h3>存档码 (数据备份)</h3>
      <textarea id="saveCodeInput" placeholder="在这里粘贴存档码，然后点击下方【导入存档】；或者点击【复制存档码】保存你的进度。"></textarea>
      <div class="code-actions">
        <button id="btnCopyCode">复制存档码</button>
        <button id="btnPasteCode">导入存档</button>
      </div>
      <button id="btnCloseCode" style="background:#f0f0f0;color:#666;padding:10px;border:none;border-radius:8px;">关闭</button>
    </div>
  </div>
<script src="./tour.js"></script>
</body>
</html>
